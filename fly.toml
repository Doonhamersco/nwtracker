# fly.toml app configuration file generated for nwtracker on 2026-08-20T22:23:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nwtracker'
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'nwtracker_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
