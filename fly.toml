app = 'nwtracker'
primary_region = 'lhr'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  DATA_DIR = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'nwtracker_data'
  destination = '/data'
  initial_size = '1gb'
